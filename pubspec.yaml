name: flexus_framework
description: Flexus Framework
version: 4.0.61+26

environment:
  sdk: ">=2.12.0 <3.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  #Development
  get: ^4.6.1
  flutter_flavor: ^3.0.3
  intl: ^0.17.0
  logger: ^2.7.0
  collection: ^1.15.0
  crypto: ^3.0.1
  path: ^1.8.0
  network_to_file_image: ^4.0.1
  path_provider: ^2.0.9
  device_preview: ^1.0.0
  package_info_plus: ^4.2.0

  #UI
  carousel_slider: ^5.1.2
  google_fonts: ^4.0.4
  font_awesome_flutter: ^10.4.0

  loading_overlay: ^0.5.0
  visibility_detector: ^0.2.2
  focus_detector: ^2.0.1
  image_picker: ^1.0.4
  image_cropper: ^4.0.1
  sizer: ^2.0.15

  #Form:
  flutter_form_builder: ^8.0.0
  form_builder_validators: ^8.6.1

  #Firebase
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.0

  #Auth
  google_sign_in: ^6.1.6
  flutter_facebook_auth: ^5.0.11
  sign_in_with_apple: ^5.0.0

dev_dependencies:
  flutter_lints: ^2.0.3
  flutter_test:
    sdk: flutter


